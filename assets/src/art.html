<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: transparent; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
      <defs>
        <radialGradient id="bg" cx="50%" cy="15%" r="95%">
          <stop offset="0" stop-color="#3a2a85" /><stop offset="0.55" stop-color="#1a1447" /><stop offset="1" stop-color="#0b0f24" />
        </radialGradient>
        <radialGradient id="glow" cx="50%" cy="55%" r="45%">
          <stop offset="0" stop-color="#7c5cff" stop-opacity=".55" /><stop offset="1" stop-color="#7c5cff" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="glass" x1="0" x2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".10" /><stop offset=".3" stop-color="#fff" stop-opacity=".18" />
          <stop offset=".7" stop-color="#fff" stop-opacity=".05" /><stop offset="1" stop-color="#fff" stop-opacity=".22" />
        </linearGradient>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" /></filter>
      </defs>
      <g id="bgLayer">
        <rect width="1024" height="1024" fill="url(#bg)" />
        <rect width="1024" height="1024" fill="url(#glow)" />
      </g>
      <g id="fgLayer">
        <g transform="translate(307 250)">
          <path d="M0 0 V420 a90 90 0 0 0 180 0 V0" fill="url(#glass)" stroke="#fff" stroke-opacity=".75" stroke-width="14" />
          <rect x="-22" y="-14" width="224" height="22" rx="11" fill="#fff" opacity=".8" />
        </g>
        <g transform="translate(537 250)">
          <path d="M0 0 V420 a90 90 0 0 0 180 0 V0" fill="url(#glass)" stroke="#fff" stroke-opacity=".75" stroke-width="14" />
          <rect x="-22" y="-14" width="224" height="22" rx="11" fill="#fff" opacity=".8" />
        </g>
        <g id="balls"></g>
      </g>
    </svg>
    <script>
      const balls = [
        [397, 610, '#ff3b4f'], [397, 460, '#ff3b4f'], [397, 310, '#ffe23f'],
        [627, 610, '#22d3ee'], [627, 460, '#22d3ee'], [627, 310, '#22d3ee'],
        [627, 150, '#ff3b4f'], // lifted ball above the right tube
      ];
      const ns = 'http://www.w3.org/2000/svg';
      const g = document.getElementById('balls');
      const defs = document.querySelector('defs');
      const el = (name, attrs) => {
        const e = document.createElementNS(ns, name);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        return e;
      };
      balls.forEach(([x, y, c], i) => {
        const grad = el('radialGradient', { id: `b${i}`, cx: '35%', cy: '30%', r: '75%' });
        grad.innerHTML = `<stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".22" stop-color="${c}"/><stop offset="1" stop-color="${c}"/>`;
        defs.appendChild(grad);
        g.appendChild(el('circle', { cx: x, cy: y, r: 72, fill: c, opacity: '.55', filter: 'url(#soft)' }));
        g.appendChild(el('circle', { cx: x, cy: y, r: 66, fill: `url(#b${i})` }));
        g.appendChild(el('circle', { cx: x, cy: y, r: 66, fill: 'none', stroke: '#000', 'stroke-opacity': '.18', 'stroke-width': 6 }));
      });
    </script>
  </body>
</html>
